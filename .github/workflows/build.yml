name: Build launcher (Windows)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      # No submodules: the launcher itself doesn't need the emulator sources.
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.7.*
          arch: win64_msvc2019_64
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cp build/Release/emu-launcher.exe dist/
          windeployqt --release dist/emu-launcher.exe

      - uses: actions/upload-artifact@v4
        with:
          name: emu-launcher-windows
          path: dist/
